<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101522">
<title>SUPER WRESTLERS 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotateNotice"><div>↻</div><h2>لف الموبايل بالعرض</h2><p>اللعبة مصممة للوضع الأفقي</p></div>

<main id="selectScreen" class="screen">
  <header class="topbar"><div><h1>SUPER WRESTLERS <b>3D</b></h1><p>اختار بطلك وابدأ التحدي ضد الكمبيوتر</p></div><div class="level-pill">LEVEL <span id="levelSelect">1</span></div></header>
  <section class="select-layout">
    <div class="selected-card">
      <img id="selectedPortrait" src="assets/portraits/01.svg" alt="صورة الشخصية المختارة">
      <div><small>بطلك الحالي</small><h2 id="selectedName">NOVA</h2><p>قوة خارقة: <span id="selectedPower">طاقة النجم</span></p></div>
    </div>
    <div class="roster-wrap"><div class="roster-heading">اختار شخصية من 32 مقاتل</div><div id="roster" class="roster"></div></div>
  </section>
  <footer class="select-footer"><p>كل مستوى أصعب من اللي قبله — اهزم البوت عشان تفتح المستوى التالي</p><button id="startBtn">ابدأ القتال</button></footer>
</main>

<main id="fightScreen" class="screen" hidden>
  <header class="fight-header">
    <div class="fighter-info"><img id="playerPortrait" src="assets/portraits/01.svg"><div><b id="playerName">NOVA</b><small>أنت</small><div class="health"><i id="playerHealth"></i></div></div></div>
    <div class="fight-center"><b>LEVEL <span id="levelFight">1</span></b><small id="arenaName">NEON CITY</small></div>
    <div class="fighter-info enemy"><div><b id="enemyName">BOT</b><small>الخصم الآلي</small><div class="health"><i id="enemyHealth"></i></div></div><img id="enemyPortrait" src="assets/portraits/02.svg"></div>
  </header>
  <div id="arena" class="arena"><canvas id="gameCanvas"></canvas><div class="arena-shade"></div><div id="fightMessage" class="fight-message"></div></div>
  <footer class="fight-controls">
    <div class="move-controls"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>
    <div class="action-controls"><button id="blockBtn" class="block">صدّ</button><button id="hitBtn" class="hit">ضربة</button><button id="powerBtn" class="power">قوة خارقة</button></div>
    <button id="menuBtn" class="back">القائمة</button>
  </footer>
</main>
<div id="resultModal" class="modal" hidden><div class="modal-card"><h2 id="resultTitle">فزت!</h2><p id="resultText"></p><button id="nextBtn">المستوى التالي</button><button id="retryBtn" class="secondary">إعادة المحاولة</button><button id="chooseBtn" class="secondary">اختيار شخصية</button></div></div>
<script src="game.js"></script>
</body></html>
